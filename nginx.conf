# ==============================================================================
# GIGA MINES - PRODUCTION NGINX CONFIGURATION
# Optimized for Astro 5 Static Output + PHP-FPM API Gateway
# MiniMines Cleantech Solutions Pvt. Ltd.
# ==============================================================================

# HTTP to HTTPS Canonical Redirect
server {
    listen 80;
    listen [::]:80;
    server_name gigamines.m-mines.com www.gigamines.m-mines.com;

    # Let's Encrypt ACME challenge location
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Production HTTPS Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gigamines.m-mines.com;

    # Document Root (compiled Astro dist directory)
    root /var/www/gigamines/dist;
    index index.html index.php;

    # SSL / TLS Modern Security Profile
    ssl_certificate /etc/letsencrypt/live/gigamines.m-mines.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gigamines.m-mines.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/gigamines.m-mines.com/chain.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security Headers (OWASP Recommended)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https://m-mines.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://m-mines.com;" always;

    # Character Encoding
    charset utf-8;

    # Gzip Compression Optimization
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml
        font/woff2;

    # Static HTML Routing (Clean URLs)
    location / {
        try_files $uri $uri/ /index.html =404;
    }

    # Clean API Route: /api/contact -> /api/contact.php
    location = /api/contact {
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/api/contact.php;
        fastcgi_param HTTP_PROXY "";
    }

    # PHP API Endpoint Routing (Handles /api/contact.php)
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock; # Adjust PHP-FPM socket version as needed
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;

        # Mitigate httpoxy vulnerability
        fastcgi_param HTTP_PROXY "";

        # FastCGI performance buffers
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
        fastcgi_connect_timeout 30s;
        fastcgi_send_timeout 30s;
        fastcgi_read_timeout 30s;
    }

    # Immutable Cache for Hashed Static Assets (Vite & Astro)
    location ~* ^/_astro/.*\.([0-9a-zA-Z]+)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Static Media & Fonts Caching
    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|svg|woff2?|eot|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # Block Access to Hidden & Sensitive Files
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block Direct Access to Inquiries Storage Directory
    location ^~ /storage/ {
        deny all;
        return 404;
    }

    # Error Pages
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

